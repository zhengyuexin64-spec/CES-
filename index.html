<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>凡人</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            min-height: 100vh;
            background: #121214;
            color: #e8e8e8;
            font-family: "Microsoft Yahei", sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            text-align: center;
            max-width: 600px;
        }
        h1 {
            font-size: 48px;
            letter-spacing: 12px;
            margin-bottom: 30px;
            color: #f0c888;
        }
        p {
            font-size: 18px;
            line-height: 2;
            color: #c9c9c9;
        }
        .line {
            width: 120px;
            height: 1px;
            background-color: #f0c888;
            margin: 30px auto;
        }
        .footer-text {
            margin-top: 40px;
            font-size:14px;
            color:#777;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>凡人</h1>
        <div class="line"></div>
        <p>
            生而平凡，心自山海。<br>
            不追浮华，守本心，渡岁月。
        </p>
        <div class="footer-text">
            凡人 · 2026
        </div>
    </div>
</body>
</html>
